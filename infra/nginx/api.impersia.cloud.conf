server {
    listen 80;
    listen [::]:80;
    server_name api.impersia.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://api.impersia.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.impersia.cloud;

    ssl_certificate /etc/letsencrypt/live/api.impersia.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.impersia.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
